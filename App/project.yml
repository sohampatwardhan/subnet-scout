name: SubnetScout
options:
  bundleIdPrefix: dev.soham.subnetscout
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
packages:
  ScannerCore:
    path: ..
targets:
  SubnetScout:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: SubnetScout
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: ScannerCore
        product: ScannerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.soham.subnetscout
        PRODUCT_NAME: SubnetScout
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SubnetScout/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SubnetScout/SubnetScout.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  SubnetScout:
    build:
      targets:
        SubnetScout: all
    run:
      config: Debug
